version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Astro and Starlight must move in lockstep, so they arrive as one pull
  # request rather than two that each break the build on their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
    ignore:
      # `npm run check` needs @astrojs/check, whose peer range stops at
      # TypeScript 6. Take a new TypeScript major only once it supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
